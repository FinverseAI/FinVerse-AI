name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/finverse
      DIRECT_URL: postgresql://ci:ci@localhost:5432/finverse
      BETTER_AUTH_URL: http://localhost:3000
      BACKEND_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm run db:generate --workspace backend
      - run: npm run lint
      - run: npm run check-types
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - run: npm run bundle:report
