version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: finverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finverse
      POSTGRES_PASSWORD: finverse123
      POSTGRES_DB: finverse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: finverse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: